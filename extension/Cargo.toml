[package]
name = "skua"
version = "0.1.0"
edition = "2024"

[lib]
name = "skua"
crate-type = ["cdylib", "rlib"]

[dependencies]
arma-rs = { version = "1.13.0", features = ["uuid"] }
uuid = { version = "1.26.0", features = ["v7"] }
deadpool-postgres = { version = "0.14.2" }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
] }
regex = "1.13.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
include_dir = "0.7.4"

[dev-dependencies]
testcontainers-modules = { version = "0.15", features = ["postgres"] }
