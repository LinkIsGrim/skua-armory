name: Extension

on:
  push:
    branches:
    - master
  pull_request:
    paths:
    - 'extension/**'
    - 'addons/main/script_macros_enums.hpp'
    - '.github/workflows/extension.yml'
  workflow_call:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: cargo fmt
      working-directory: extension
      run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: cargo clippy
      working-directory: extension
      run: cargo clippy --locked --all-targets -- -D warnings -W clippy::pedantic

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Cache Postgres image
      id: pg-cache
      uses: actions/cache@v4
      with:
        path: /tmp/postgres-image.tar
        key: docker-postgres-18-alpine

    - name: Load or pull Postgres image
      run: |
        if [ -f /tmp/postgres-image.tar ]; then
          docker load -i /tmp/postgres-image.tar
        else
          docker pull postgres:18-alpine
          docker save postgres:18-alpine -o /tmp/postgres-image.tar
        fi

    - name: cargo test
      working-directory: extension
      run: cargo test --locked
