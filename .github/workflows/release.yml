name: Publish to Workshop

on:
  push:
    tags:
    - 'v*.*.*'
  # Escape hatch: republish (or first-time publish) any existing tag without
  # touching the tag itself. Useful when release.yml didn't fire on the
  # original push.tags event for any reason.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.14.2)'
        required: true
        type: string
      dry_run:
        description: 'Skip Workshop upload (build only)'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    steps:
    - name: Install Arma 3 Tools
      # Pinned to our fork's branch until arma-actions/arma3-tools#3
      # (Basic Auth via headers instead of URL-embedded credentials)
      # merges upstream -- switch back to arma-actions/arma3-tools@master
      # once it does.
      uses: LinkIsGrim/arma3-tools@basic-auth-headers
      with:
        toolsUrl: ${{ secrets.ARMA3_TOOLS_URL }}

    - name: Checkout the source code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.tag || github.ref }}
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Install Windows target
      run: rustup target add x86_64-pc-windows-msvc

    - name: Install cargo-xwin and cross
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-xwin,cross

    - name: Cache xwin SDK
      uses: actions/cache@v4
      with:
        path: ~/.cache/cargo-xwin
        key: xwin-${{ runner.os }}-v1

    # For push.tags GITHUB_REF is "refs/tags/v2.14.2" (strip 11 chars).
    # For workflow_dispatch we read the input directly.
    - name: Set VERSION env
      run: |
        if [[ -n "${{ inputs.tag }}" ]]; then
          echo "VERSION=${INPUT_TAG#v}" >> "$GITHUB_ENV"
        else
          echo "VERSION=${GITHUB_REF:11}" >> "$GITHUB_ENV"
        fi
      env:
        INPUT_TAG: ${{ inputs.tag }}

    - name: Build Linux extension
      run: |
        CARGO_TARGET_DIR=target-cross cross build --release --locked --target x86_64-unknown-linux-gnu
        cp target-cross/x86_64-unknown-linux-gnu/release/libskua.so skua_x64.so

    - name: Build Windows extension
      run: |
        cargo xwin build --release --target x86_64-pc-windows-msvc
        cp target/x86_64-pc-windows-msvc/release/skua.dll skua_x64.dll

    - name: Setup HEMTT
      uses: arma-actions/hemtt@v1
      with:
        annotate: false

    - name: Run HEMTT release
      run: hemtt release

    - name: Archive release artifact
      uses: actions/upload-artifact@v4
      with:
        name: skua-armory-${{ env.VERSION }}
        path: .hemttout/release
        if-no-files-found: error

    - name: Upload to Workshop
      if: ${{ !inputs.dry_run }}
      uses: arma-actions/workshop-upload@v1
      with:
        appId: '107410'    # default
        itemId: '3680089530' # Id of item to update
        contentPath: '.hemttout/release'
        changelog: 'https://github.com/skua-international/skua-armory/releases/tag/v${{ env.VERSION }}' # set to github tag link
      env:
        STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
